<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>환율 계산기</title>
  
  <!-- iOS PWA 호환 메타 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="환율 계산기">
  <link rel="apple-touch-icon" href="https://placehold.co/180x180/FFFFFF/007AFF.png?text=%24">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* fixed inset-0와 함께 뷰포트 바운스 및 스크롤을 원천 차단 */
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #F3F4F6;
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none; 
    }
    * { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 안전 영역 패딩 최적화 */
    .safe-padding-top { padding-top: max(3rem, env(safe-area-inset-top)); }
    .safe-padding-bottom { padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
  </style>
</head>

<body class="bg-gray-100 select-none">
  <div class="w-full h-full flex items-center justify-center touch-manipulation sm:p-4">
    <!-- 앱 메인 컨테이너 (h-full로 body의 fixed 영역에 완벽히 맞춤) -->
    <div class="w-full h-full sm:w-[393px] sm:h-[852px] bg-white sm:rounded-[3rem] shadow-[0_8px_30px_rgb(0,0,0,0.08)] overflow-hidden sm:border sm:border-gray-200 flex flex-col relative">
      
      <!-- 상단 디스플레이 영역 -->
      <div class="flex-1 flex flex-col px-5 safe-padding-top pb-2 relative min-h-0">
        
        <!-- 상단 모드 전환 토글 (mb-auto를 통해 상단에 고정하고 아래쪽을 밀어냄) -->
        <div class="w-full flex justify-center z-10 shrink-0 mb-auto">
          <div class="bg-gray-100 p-1 rounded-full flex gap-1 border border-gray-200/50 shadow-inner">
            <button id="toggle-realtime" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-200 bg-white text-gray-900 shadow-sm">실시간 환율</button>
            <button id="toggle-fixed" class="px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-200 text-gray-400 hover:text-gray-900">고정 환율</button>
          </div>
        </div>

        <!-- 통화 금액 영역 래퍼 (mt-4로 토글과 적당한 간격 확보) -->
        <div class="flex flex-col mt-4 w-full">
          <!-- 기준 통화 -->
          <div id="base-currency-section" class="flex justify-between items-center p-3 sm:p-5 rounded-3xl mb-1 sm:mb-2 transition-colors duration-200 bg-gray-100 cursor-pointer active:scale-[0.98]">
            <div class="flex flex-col items-center justify-center shrink-0 w-[4.5rem]">
              <div id="base-flag" class="w-[52px] h-[34px] rounded-sm flex items-center justify-center bg-white shadow-sm mb-1 overflow-hidden border border-gray-200"></div>
              <h2 id="base-code" class="text-lg font-bold text-gray-900 tracking-wider leading-none mt-1">USD</h2>
            </div>
            <div id="base-amount-wrapper" class="flex-1 overflow-x-auto no-scrollbar ml-2 flex justify-end items-center h-full hover:bg-gray-200/50 rounded-xl px-2 transition-colors" title="금액 터치 시 고정환율 설정">
              <div id="base-amount" class="text-5xl font-light tracking-tight text-gray-900 transition-all duration-200 whitespace-nowrap">0</div>
            </div>
          </div>

          <!-- 대상 통화 -->
          <div id="target-currency-section" class="flex justify-between items-center p-3 sm:p-5 rounded-3xl transition-colors duration-200 bg-transparent cursor-pointer active:scale-[0.98]">
            <div class="flex flex-col items-center justify-center shrink-0 w-[4.5rem]">
              <div id="target-flag" class="w-[52px] h-[34px] rounded-sm flex items-center justify-center bg-white shadow-sm mb-1 overflow-hidden border border-gray-200"></div>
              <h2 id="target-code" class="text-lg font-bold text-gray-500 tracking-wider leading-none mt-1">KRW</h2>
            </div>
            <div id="target-amount-wrapper" class="flex-1 overflow-x-auto no-scrollbar ml-2 flex justify-end items-center h-full hover:bg-gray-100 rounded-xl px-2 transition-colors" title="금액 터치 시 고정환율 설정">
              <div id="target-amount" class="text-5xl font-light tracking-tight text-gray-400 transition-all duration-200 whitespace-nowrap">0</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 중앙 키패드 영역 (세로 공간 낭비를 막기 위해 버튼 크기 제한) -->
      <div class="px-5 pb-2 shrink-0">
        <div id="keypad" class="grid grid-cols-4 gap-2 sm:gap-3 max-w-[24rem] mx-auto"></div>
      </div>

      <!-- 하단 상태 바 (여백 확장 및 글자 넘침으로 인한 버튼 밀림 차단) -->
      <div class="bg-gray-50 border-t border-gray-100 px-6 sm:px-8 pt-3 safe-padding-bottom flex items-center justify-between text-gray-500 text-sm shrink-0">
        <!-- shrink-0 으로 좌측 버튼 찌그러짐 차단 -->
        <button id="refresh-btn" class="shrink-0 p-3 -ml-2 hover:bg-gray-200 rounded-full transition-colors flex items-center justify-center" aria-label="환율 새로고침">
          <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
        </button>
        
        <!-- 중앙 텍스트 영역 (flex-1과 min-w-0, truncate를 조합해 좌우 버튼 밀어내기 원천 방지) -->
        <div class="flex flex-col items-center flex-1 min-w-0 px-2 text-center">
          <span id="rate-info" class="font-semibold text-gray-700 truncate w-full">1 USD = 1,443.50 KRW</span>
          <span id="update-time" class="text-xs mt-0.5 text-gray-400 font-medium truncate w-full">업데이트: 방금</span>
        </div>

        <!-- shrink-0 으로 우측 버튼 찌그러짐 차단 -->
        <button id="info-btn" class="shrink-0 p-3 -mr-2 hover:bg-gray-200 rounded-full transition-colors flex items-center justify-center" aria-label="정보">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
          </svg>
        </button>
      </div>
      
      <!-- 통화 선택 모달 -->
      <div id="currency-modal" class="absolute inset-0 bg-white z-50 flex flex-col transition-transform duration-300 translate-y-full rounded-[inherit] overflow-hidden">
        <div class="flex items-center p-4 mt-12 sm:mt-8 relative shrink-0">
          <button id="close-modal-btn" class="absolute left-4 p-2 text-[#007AFF] hover:opacity-80 transition-opacity font-semibold">취소</button>
          <h2 class="flex-1 text-center text-lg font-bold text-gray-900">통화 선택</h2>
        </div>
        <div class="px-5 pb-4 border-b border-gray-100 shrink-0">
          <div class="bg-gray-100 rounded-xl flex items-center px-4 py-2.5">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-gray-400 mr-2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="currency-search" placeholder="통화명 또는 코드 검색" class="bg-transparent border-none outline-none text-gray-900 w-full placeholder-gray-400 text-base font-medium" autocomplete="off">
          </div>
        </div>
        <div id="currency-list" class="flex-1 overflow-y-auto no-scrollbar px-3 pt-2 pb-10"></div>
      </div>

      <!-- 고정 환율 설정 모달 -->
      <div id="fixed-rate-modal" class="absolute inset-0 z-50 flex flex-col justify-end transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="absolute inset-0 bg-gray-900/40" id="fixed-rate-backdrop"></div>
        <div class="bg-white rounded-t-3xl shadow-2xl p-6 pb-10 transform transition-transform duration-300 translate-y-full relative z-10" id="fixed-rate-sheet">
          <h3 class="text-lg font-bold text-gray-900 mb-1">고정 환율 설정</h3>
          <p class="text-sm text-gray-500 mb-6">1 <span id="fixed-target-code" class="font-bold text-[#007AFF]">USD</span> 당 적용할 환율을 입력하세요.</p>
          
          <div class="flex items-center bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 mb-6 focus-within:border-[#007AFF] focus-within:bg-white transition-colors">
            <span class="text-gray-400 font-semibold mr-2 text-lg">₩</span>
            <input type="number" id="fixed-rate-input" inputmode="decimal" class="bg-transparent border-none outline-none text-gray-900 w-full text-2xl font-bold" placeholder="예: 1400">
          </div>
          
          <div class="flex gap-3">
            <button id="close-fixed-btn" class="flex-1 py-4 rounded-xl bg-gray-100 text-gray-700 font-bold text-lg hover:bg-gray-200 transition-colors">취소</button>
            <button id="save-fixed-btn" class="flex-1 py-4 rounded-xl bg-[#007AFF] text-white font-bold text-lg hover:bg-blue-600 transition-colors">적용하기</button>
          </div>
        </div>
      </div>
      
      <!-- 환율 차트 모달 -->
      <div id="graph-modal" class="absolute inset-0 bg-white z-50 flex flex-col transition-transform duration-300 translate-y-full rounded-[inherit] overflow-hidden">
        <div class="flex items-center p-4 mt-12 sm:mt-8 relative shrink-0">
          <button id="close-graph-btn" class="absolute left-4 p-2 text-[#007AFF] hover:opacity-80 transition-opacity">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h2 id="graph-title" class="flex-1 text-center text-lg font-bold text-gray-900">환율 추이</h2>
        </div>
        <div class="flex-1 px-5 pb-10 flex flex-col items-center justify-start mt-2 overflow-y-auto no-scrollbar">
          <div class="w-full flex justify-between items-end mb-6 shrink-0">
            <div>
              <div class="text-gray-500 text-sm mb-1 font-semibold" id="graph-subtitle">USD / KRW</div>
              <div class="text-gray-900 text-4xl font-bold tracking-tight" id="graph-current-rate">1,443.50</div>
            </div>
            <div id="graph-variance" class="text-[#007AFF] text-sm font-bold bg-blue-50 px-2 py-1 rounded-md mb-1">+0.24%</div>
          </div>
          <div class="w-full h-64 relative shrink-0">
            <canvas id="exchangeChart"></canvas>
          </div>
          <div class="flex gap-2 mt-8 bg-gray-100 p-1.5 rounded-xl w-full shrink-0" id="graph-tabs">
            <button data-period="1w" class="graph-tab flex-1 py-2 text-sm font-bold rounded-lg bg-white text-gray-900 shadow-sm transition-colors border border-gray-200/50">1주</button>
            <button data-period="1m" class="graph-tab flex-1 py-2 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-900 transition-colors">1개월</button>
            <button data-period="3m" class="graph-tab flex-1 py-2 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-900 transition-colors">3개월</button>
            <button data-period="1y" class="graph-tab flex-1 py-2 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-900 transition-colors">1년</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 38개국 데이터 유지
    const CURRENCIES = {
      KRW: { code: 'KRW', name: '대한민국 원', flag: 'kr', rate: 1443.50 },
      USD: { code: 'USD', name: '미국 달러', flag: 'us', rate: 1 },
      VND: { code: 'VND', name: '베트남 동', flag: 'vn', rate: 25420.50 },
      SGD: { code: 'SGD', name: '싱가포르 달러', flag: 'sg', rate: 1.34 },
      IDR: { code: 'IDR', name: '인도네시아 루피아', flag: 'id', rate: 16150.00 },
      JPY: { code: 'JPY', name: '일본 엔화', flag: 'jp', rate: 153.20 },
      EUR: { code: 'EUR', name: '유로', flag: 'eu', rate: 0.92 },
      THB: { code: 'THB', name: '태국 바트', flag: 'th', rate: 36.50 },
      CNY: { code: 'CNY', name: '중국 위안화', flag: 'cn', rate: 7.23 },
      RUB: { code: 'RUB', name: '러시아 루블', flag: 'ru', rate: 91.20 },
      PHP: { code: 'PHP', name: '필리핀 페소', flag: 'ph', rate: 58.10 },
      HKD: { code: 'HKD', name: '홍콩 달러', flag: 'hk', rate: 7.82 },
      UZS: { code: 'UZS', name: '우즈베키스탄 숨', flag: 'uz', rate: 12650.00 },
      TWD: { code: 'TWD', name: '신 타이완 달러', flag: 'tw', rate: 32.40 },
      GBP: { code: 'GBP', name: '영국 파운드', flag: 'gb', rate: 0.78 },
      MYR: { code: 'MYR', name: '말레이시아 링깃', flag: 'my', rate: 4.70 },
      AUD: { code: 'AUD', name: '호주 달러', flag: 'au', rate: 1.51 },
      CAD: { code: 'CAD', name: '캐나다 달러', flag: 'ca', rate: 1.36 },
      CHF: { code: 'CHF', name: '스위스 프랑', flag: 'ch', rate: 0.90 },
      INR: { code: 'INR', name: '인도 루피', flag: 'in', rate: 83.50 },
      BRL: { code: 'BRL', name: '브라질 헤알', flag: 'br', rate: 5.10 },
      ZAR: { code: 'ZAR', name: '남아프리카공화국 랜드', flag: 'za', rate: 18.50 },
      MXN: { code: 'MXN', name: '멕시코 페소', flag: 'mx', rate: 17.00 },
      NZD: { code: 'NZD', name: '뉴질랜드 달러', flag: 'nz', rate: 1.65 },
      SEK: { code: 'SEK', name: '스웨덴 크로나', flag: 'se', rate: 10.80 },
      NOK: { code: 'NOK', name: '노르웨이 크로네', flag: 'no', rate: 10.90 },
      DKK: { code: 'DKK', name: '덴마크 크로네', flag: 'dk', rate: 6.90 },
      TRY: { code: 'TRY', name: '튀르키예 리라', flag: 'tr', rate: 32.20 },
      PLN: { code: 'PLN', name: '폴란드 즈워티', flag: 'pl', rate: 3.95 },
      AED: { code: 'AED', name: 'UAE 디르함', flag: 'ae', rate: 3.67 },
      SAR: { code: 'SAR', name: '사우디아라비아 리얄', flag: 'sa', rate: 3.75 },
      KZT: { code: 'KZT', name: '카자흐스탄 텡게', flag: 'kz', rate: 440.00 },
      QAR: { code: 'QAR', name: '카타르 리얄', flag: 'qa', rate: 3.64 },
      KWD: { code: 'KWD', name: '쿠웨이트 디나르', flag: 'kw', rate: 0.31 },
      ARS: { code: 'ARS', name: '아르헨티나 페소', flag: 'ar', rate: 880.00 },
      CLP: { code: 'CLP', name: '칠레 페소', flag: 'cl', rate: 930.00 },
      EGP: { code: 'EGP', name: '이집트 파운드', flag: 'eg', rate: 47.00 },
      ILS: { code: 'ILS', name: '이스라엘 신셰켈', flag: 'il', rate: 3.70 }
    };

    const KEYPAD_BUTTONS = [
      'C', '←', '%', '÷',
      '7', '8', '9', '×',
      '4', '5', '6', '−',
      '1', '2', '3', '+',
      '⇅', '0', '.', '='
    ];

    let state = {
      baseCurrency: localStorage.getItem('calc_base_currency') || 'USD',
      targetCurrency: localStorage.getItem('calc_target_currency') || 'KRW',
      mode: localStorage.getItem('calc_mode') || 'realtime', 
      fixedRates: JSON.parse(localStorage.getItem('calc_fixed_rates')) || {}, 
      expression: '0',
      hasError: false,
      isRefreshing: false,
      selectingType: null,
      fixingCurrencyCode: null
    };

    let chartInstance = null;
    const deleteIconSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>`;

    const els = {
      toggleRealtime: document.getElementById('toggle-realtime'),
      toggleFixed: document.getElementById('toggle-fixed'),
      baseSection: document.getElementById('base-currency-section'),
      baseFlag: document.getElementById('base-flag'),
      baseCode: document.getElementById('base-code'),
      baseAmount: document.getElementById('base-amount'),
      targetSection: document.getElementById('target-currency-section'),
      targetFlag: document.getElementById('target-flag'),
      targetCode: document.getElementById('target-code'),
      targetAmount: document.getElementById('target-amount'),
      rateInfo: document.getElementById('rate-info'),
      keypad: document.getElementById('keypad'),
      refreshBtn: document.getElementById('refresh-btn'),
      refreshIcon: document.getElementById('refresh-icon'),
      updateTime: document.getElementById('update-time'),
      modal: document.getElementById('currency-modal'),
      closeModalBtn: document.getElementById('close-modal-btn'),
      searchInput: document.getElementById('currency-search'),
      currencyList: document.getElementById('currency-list'),
      infoBtn: document.getElementById('info-btn'),
      graphModal: document.getElementById('graph-modal'),
      closeGraphBtn: document.getElementById('close-graph-btn'),
      graphTitle: document.getElementById('graph-title'),
      graphSubtitle: document.getElementById('graph-subtitle'),
      graphCurrentRate: document.getElementById('graph-current-rate'),
      graphVariance: document.getElementById('graph-variance'),
      fixedRateModal: document.getElementById('fixed-rate-modal'),
      fixedRateBackdrop: document.getElementById('fixed-rate-backdrop'),
      fixedRateSheet: document.getElementById('fixed-rate-sheet'),
      fixedTargetCode: document.getElementById('fixed-target-code'),
      fixedRateInput: document.getElementById('fixed-rate-input'),
      closeFixedBtn: document.getElementById('close-fixed-btn'),
      saveFixedBtn: document.getElementById('save-fixed-btn'),
    };

    const getBaseRate = (currencyCode) => {
      if (currencyCode === 'USD') return 1;
      
      if (state.mode === 'fixed') {
        const pairKey = `USD_${currencyCode}`;
        if (state.fixedRates[pairKey]) return state.fixedRates[pairKey];
      }
      return CURRENCIES[currencyCode].rate;
    };

    const getRate = (base, target) => {
      if (base === target) return 1;
      const baseToUsd = 1 / getBaseRate(base);
      return baseToUsd * getBaseRate(target);
    };

    const evaluateExpression = (expr) => {
      try {
        if (!expr || expr === '0') return 0;
        const cleanExpr = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '');
        if (/\/0(?!\.)/.test(cleanExpr)) return null;
        const result = new Function(`'use strict'; return (${cleanExpr})`)();
        if (!Number.isFinite(result)) return null;
        return Number(result);
      } catch (e) {
        return null;
      }
    };

    const formatExpressionText = (expr) => {
      return expr.replace(/\d+(\.\d*)?/g, (match) => {
        if (match === '.') return match;
        const [intPart, decimalPart] = match.split('.');
        const formattedInt = intPart === '' ? '' : parseInt(intPart, 10).toLocaleString('en-US');
        return decimalPart !== undefined ? `${formattedInt}.${decimalPart}` : formattedInt;
      });
    };

    const adjustFontSize = (element, text) => {
      element.textContent = text;
      const len = text.length;
      if (len > 22) element.style.fontSize = '1.1rem'; 
      else if (len > 18) element.style.fontSize = '1.3rem'; 
      else if (len > 14) element.style.fontSize = '1.75rem'; 
      else if (len > 10) element.style.fontSize = '2.25rem'; 
      else element.style.fontSize = ''; 
    };

    const updateUI = () => {
      const base = CURRENCIES[state.baseCurrency];
      const target = CURRENCIES[state.targetCurrency];
      const rate = getRate(state.baseCurrency, state.targetCurrency);

      if (state.mode === 'realtime') {
        els.toggleRealtime.className = "px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-200 bg-white text-gray-900 shadow-sm";
        els.toggleFixed.className = "px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-200 text-gray-400 hover:text-gray-900";
        els.updateTime.textContent = '업데이트: 방금 (API)';
      } else {
        els.toggleRealtime.className = "px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-200 text-gray-400 hover:text-gray-900";
        els.toggleFixed.className = "px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-200 bg-white text-gray-900 shadow-sm";
        els.updateTime.textContent = '고정 환율 적용됨';
      }

      els.baseFlag.innerHTML = `<img src="https://flagcdn.com/w80/${base.flag}.png" class="w-full h-full object-cover">`;
      els.baseCode.textContent = base.code;
      adjustFontSize(els.baseAmount, formatExpressionText(state.expression));
      
      els.targetFlag.innerHTML = `<img src="https://flagcdn.com/w80/${target.flag}.png" class="w-full h-full object-cover">`;
      els.targetCode.textContent = target.code;

      if (state.hasError) {
        els.baseAmount.classList.add('text-red-500');
        els.baseAmount.classList.remove('text-gray-900');
        adjustFontSize(els.targetAmount, '오류');
      } else {
        els.baseAmount.classList.remove('text-red-500');
        els.baseAmount.classList.add('text-gray-900');
        
        const currentAmount = evaluateExpression(state.expression);
        if (currentAmount !== null) {
          const converted = currentAmount * rate;
          const formattedTarget = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(converted);
          adjustFontSize(els.targetAmount, formattedTarget);
        }
      }

      els.rateInfo.textContent = `1 ${base.code} = ${rate.toLocaleString('en-US', { maximumFractionDigits: 2 })} ${target.code}`;
    };

    const switchMode = (newMode) => {
      state.mode = newMode;
      localStorage.setItem('calc_mode', newMode);
      updateUI();
    };

    els.toggleRealtime.addEventListener('click', () => switchMode('realtime'));
    els.toggleFixed.addEventListener('click', () => switchMode('fixed'));

    const handleKeyClick = (key) => {
      state.hasError = false;
      let prev = state.expression;
      const isOperator = ['÷', '×', '−', '+'].includes(key);
      const lastChar = prev.slice(-1);
      const isLastCharOperator = ['÷', '×', '−', '+'].includes(lastChar);

      if (key === 'C') {
        state.expression = '0';
      } else if (key === '←') {
        state.expression = prev.length > 1 ? prev.slice(0, -1) : '0';
      } else if (key === '⇅') {
        const temp = state.baseCurrency;
        state.baseCurrency = state.targetCurrency;
        state.targetCurrency = temp;
        localStorage.setItem('calc_base_currency', state.baseCurrency);
        localStorage.setItem('calc_target_currency', state.targetCurrency);
      } else if (key === '=') {
        const result = evaluateExpression(prev);
        if (result === null) state.hasError = true;
        else state.expression = parseFloat(result.toFixed(4)).toString();
      } else if (key === '%') {
        const result = evaluateExpression(prev);
        if (result !== null) state.expression = (result / 100).toString();
      } else {
        if (isOperator) {
          if (isLastCharOperator) state.expression = prev.slice(0, -1) + key;
          else if (lastChar === '.') state.expression = prev.slice(0, -1) + key;
          else state.expression = prev + key;
        } else {
          if (prev === '0' && key !== '.') state.expression = key;
          else if (prev.length < 20 || isLastCharOperator) state.expression = prev + key;
        }
      }
      updateUI();
    };

    const renderKeypad = () => {
      els.keypad.innerHTML = '';
      KEYPAD_BUTTONS.forEach(btn => {
        const isOperator = ['÷', '×', '−', '+', '='].includes(btn);
        const isAction = ['C', '←', '⇅', '%'].includes(btn);
        
        let bgColor = 'bg-[#F3F4F6] hover:bg-[#E5E7EB] text-gray-900'; 
        if (isOperator) bgColor = 'bg-[#007AFF] hover:bg-[#005AD4] text-white'; 
        if (isAction) bgColor = 'bg-[#E5E7EB] hover:bg-[#D1D5DB] text-gray-800'; 

        // 버튼 최대 크기 설정(max-w, max-h)을 통해 화면 높이가 작은 아이폰 밀림 방지
        const button = document.createElement('button');
        button.className = `w-full max-w-[5.5rem] max-h-[5.5rem] aspect-square rounded-full flex items-center justify-center text-[1.75rem] font-medium transition-all duration-100 active:scale-95 active:opacity-80 mx-auto ${bgColor}`;
        
        if (btn === '←') button.innerHTML = deleteIconSVG;
        else button.textContent = btn;

        button.addEventListener('click', () => handleKeyClick(btn));
        els.keypad.appendChild(button);
      });
    };

    const openModal = (type) => {
      state.selectingType = type;
      els.searchInput.value = '';
      renderCurrencyList();
      els.modal.classList.remove('translate-y-full');
      els.modal.classList.add('translate-y-0');
    };

    const closeModal = () => {
      els.modal.classList.remove('translate-y-0');
      els.modal.classList.add('translate-y-full');
    };

    const selectCurrency = (code) => {
      if (state.selectingType === 'base') {
        state.baseCurrency = code;
        localStorage.setItem('calc_base_currency', code);
      } else {
        state.targetCurrency = code;
        localStorage.setItem('calc_target_currency', code);
      }
      updateUI();
      closeModal();
    };

    const renderCurrencyList = () => {
      const query = els.searchInput.value.toLowerCase().trim();
      els.currencyList.innerHTML = '';
      
      Object.values(CURRENCIES).forEach(currency => {
        if (currency.name.toLowerCase().includes(query) || currency.code.toLowerCase().includes(query)) {
          const item = document.createElement('div');
          item.className = 'flex items-center justify-between p-4 mb-1 hover:bg-gray-50 rounded-2xl cursor-pointer transition-colors active:bg-gray-100 border border-transparent border-b-gray-50';
          item.onclick = () => selectCurrency(currency.code);
          
          item.innerHTML = `
            <div class="flex items-center gap-4">
              <div class="w-11 h-[28px] rounded-sm flex items-center justify-center bg-white shadow-sm border border-gray-200 overflow-hidden shrink-0">
                <img src="https://flagcdn.com/w80/${currency.flag}.png" class="w-full h-full object-cover">
              </div>
              <span class="text-gray-900 font-semibold text-lg tracking-wide">${currency.name}</span>
            </div>
            <span class="text-[#007AFF] font-bold tracking-wider">${currency.code}</span>
          `;
          els.currencyList.appendChild(item);
        }
      });
    };

    const handleAmountClick = (type) => {
      if (state.mode !== 'fixed') switchMode('fixed');

      let targetToFix = type === 'base' ? state.baseCurrency : state.targetCurrency;
      if (targetToFix === 'USD') targetToFix = type === 'base' ? state.targetCurrency : state.baseCurrency;
      if (targetToFix === 'USD') return;

      state.fixingCurrencyCode = targetToFix;
      els.fixedTargetCode.textContent = targetToFix;
      els.fixedRateInput.value = getBaseRate(targetToFix).toFixed(2);
      
      els.fixedRateModal.classList.remove('pointer-events-none');
      els.fixedRateModal.classList.add('opacity-100');
      setTimeout(() => els.fixedRateSheet.classList.remove('translate-y-full'), 10);
    };

    const closeFixedModal = () => {
      els.fixedRateSheet.classList.add('translate-y-full');
      setTimeout(() => {
        els.fixedRateModal.classList.remove('opacity-100');
        els.fixedRateModal.classList.add('pointer-events-none');
      }, 300);
    };

    els.saveFixedBtn.addEventListener('click', () => {
      const val = parseFloat(els.fixedRateInput.value);
      if (!isNaN(val) && val > 0) {
        const pairKey = `USD_${state.fixingCurrencyCode}`;
        state.fixedRates[pairKey] = val;
        localStorage.setItem('calc_fixed_rates', JSON.stringify(state.fixedRates));
        updateUI();
      }
      closeFixedModal();
    });

    els.closeFixedBtn.addEventListener('click', closeFixedModal);
    els.fixedRateBackdrop.addEventListener('click', closeFixedModal);

    els.baseSection.addEventListener('click', (e) => {
      if (e.target.closest('#base-amount-wrapper')) handleAmountClick('base');
      else openModal('base');
    });
    els.targetSection.addEventListener('click', (e) => {
      if (e.target.closest('#target-amount-wrapper')) handleAmountClick('target');
      else openModal('target');
    });

    const generateChartData = (currentRate, period = '1w') => {
      const data = [];
      const labels = [];
      let rate = currentRate;
      let dataPoints = 7;
      let labelStep = 'day';

      if (period === '1w') { dataPoints = 7; labelStep = 'day'; }
      if (period === '1m') { dataPoints = 30; labelStep = 'day'; }
      if (period === '3m') { dataPoints = 90; labelStep = 'day'; }
      if (period === '1y') { dataPoints = 12; labelStep = 'month'; }

      for (let i = dataPoints - 1; i >= 0; i--) {
        const date = new Date();
        if (labelStep === 'day') {
          date.setDate(date.getDate() - i);
          labels.push(`${date.getMonth() + 1}/${date.getDate()}`);
        } else {
          date.setMonth(date.getMonth() - i);
          const year = date.getFullYear().toString().slice(2);
          labels.push(`${year}년 ${date.getMonth() + 1}월`);
        }
        
        if (state.mode === 'fixed') {
          data.push(currentRate);
        } else {
          if (i !== 0) {
            const volatility = period === '1y' ? 0.05 : (period === '3m' ? 0.03 : 0.02);
            rate = rate + (Math.random() - 0.5) * (currentRate * volatility);
          } else {
            rate = currentRate; 
          }
          data.push(rate);
        }
      }
      return { labels, data };
    };

    let currentGraphPeriod = '1w';

    const renderChart = (rate, period) => {
      const chartData = generateChartData(rate, period);
      const target = CURRENCIES[state.targetCurrency];
      const ctx = document.getElementById('exchangeChart').getContext('2d');

      if (chartInstance) chartInstance.destroy();

      Chart.defaults.font.family = "'Inter', sans-serif";
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: chartData.labels,
          datasets: [{
            label: '환율',
            data: chartData.data,
            borderColor: '#007AFF', 
            backgroundColor: 'rgba(0, 122, 255, 0.1)', 
            borderWidth: 2.5,
            pointBackgroundColor: '#FFFFFF',
            pointBorderColor: '#007AFF',
            pointBorderWidth: 2,
            pointRadius: (period === '1m' || period === '3m') ? 0 : 4,
            pointHoverRadius: 6,
            fill: true,
            tension: state.mode === 'fixed' ? 0 : 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { padding: 12, callbacks: { label: function(context) { return context.parsed.y.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ` ${target.code}`; } } } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#9CA3AF', maxTicksLimit: period === '3m' ? 6 : (period === '1m' ? 5 : 7) }, border: { display: false } },
            y: { grid: { color: '#F3F4F6' }, ticks: { color: '#9CA3AF', maxTicksLimit: 5 }, border: { dash: [4, 4], display: false } }
          },
          interaction: { intersect: false, mode: 'index' },
        }
      });
    };

    const updateGraphTabUI = (selectedPeriod) => {
      document.querySelectorAll('.graph-tab').forEach(tab => {
        if (tab.dataset.period === selectedPeriod) tab.className = 'graph-tab flex-1 py-2 text-sm font-bold rounded-lg bg-white text-[#007AFF] shadow-sm transition-colors border border-gray-200';
        else tab.className = 'graph-tab flex-1 py-2 text-sm font-bold rounded-lg text-gray-400 hover:text-gray-700 transition-colors border border-transparent';
      });
    };

    const openGraphModal = () => {
      const base = CURRENCIES[state.baseCurrency];
      const target = CURRENCIES[state.targetCurrency];
      const rate = getRate(state.baseCurrency, state.targetCurrency);

      els.graphTitle.textContent = `${base.name} 환율 추이`;
      els.graphSubtitle.textContent = `${base.code} / ${target.code}`;
      els.graphCurrentRate.textContent = rate.toLocaleString('en-US', { maximumFractionDigits: 2 });
      
      els.graphVariance.textContent = state.mode === 'fixed' ? '0.00% (고정)' : '+0.24%';
      els.graphVariance.className = state.mode === 'fixed' ? 'text-gray-500 text-sm font-bold bg-gray-100 px-2 py-1 rounded-md mb-1' : 'text-[#007AFF] text-sm font-bold bg-blue-50 px-2 py-1 rounded-md mb-1';

      els.graphModal.classList.remove('translate-y-full');
      els.graphModal.classList.add('translate-y-0');

      currentGraphPeriod = '1w';
      updateGraphTabUI(currentGraphPeriod);
      setTimeout(() => renderChart(rate, currentGraphPeriod), 300);
    };

    document.querySelectorAll('.graph-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        const period = e.target.dataset.period;
        if (period === currentGraphPeriod) return; 
        currentGraphPeriod = period;
        updateGraphTabUI(period);
        renderChart(getRate(state.baseCurrency, state.targetCurrency), period); 
      });
    });

    const closeGraphModal = () => {
      els.graphModal.classList.remove('translate-y-0');
      els.graphModal.classList.add('translate-y-full');
    };

    const fetchRealTimeRates = async () => {
      if (state.isRefreshing || state.mode === 'fixed') return;
      state.isRefreshing = true;
      els.refreshIcon.classList.add('animate-spin', 'text-[#007AFF]');
      
      try {
        const response = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await response.json();
        if (data && data.rates) {
          Object.keys(CURRENCIES).forEach(code => {
            if (data.rates[code]) CURRENCIES[code].rate = data.rates[code];
          });
          const now = new Date();
          els.updateTime.textContent = `업데이트: ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} (API)`;
        }
      } catch (error) {
        console.warn('API fetch failed');
      } finally {
        state.isRefreshing = false;
        els.refreshIcon.classList.remove('animate-spin', 'text-[#007AFF]');
        updateUI();
      }
    };

    els.refreshBtn.addEventListener('click', fetchRealTimeRates);
    els.closeModalBtn.addEventListener('click', closeModal);
    els.searchInput.addEventListener('input', renderCurrencyList);
    els.infoBtn.addEventListener('click', openGraphModal);
    els.closeGraphBtn.addEventListener('click', closeGraphModal);

    window.onload = () => {
      renderKeypad();
      fetchRealTimeRates(); 
      updateUI();
    };
  </script>
</body>
</html>
